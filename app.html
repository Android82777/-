<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>МосМесто — приложение</title>
<meta name="theme-color" content="#0b0c14">
<meta name="description" content="Приложение МосМесто: карта помещений, маршрут до помещения, отметка «я на месте», осмотр с фото и работа без интернета.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="МосМесто">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{var s=JSON.parse(localStorage.getItem("ms_app_settings")||"{}"),t=s.theme||"auto";if(t==="light"||(t==="auto"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<style>
:root{--bg:#090a12;--bg2:#0f1020;--surface:#151729;--surface2:#1c1f36;--line:rgba(255,255,255,.09);--text:#f0f1ff;--muted:#9a9fc0;--acc:#7c6cff;--acc2:#4aa3ff;--grad:linear-gradient(135deg,#7c6cff,#4aa3ff);--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b81;--shadow:0 14px 40px rgba(0,0,0,.45);--tab:rgba(14,15,30,.82);color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f2fb;--bg2:#e9e8f6;--surface:#fff;--surface2:#f0effa;--line:rgba(30,25,90,.1);--text:#161433;--muted:#6b6e92;--shadow:0 14px 36px rgba(60,50,150,.16);--tab:rgba(255,255,255,.86);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;justify-content:center;background:radial-gradient(900px 600px at 50% -10%,rgba(124,108,255,.22),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background:var(--bg)}
@media(min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.5)}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(108px + env(safe-area-inset-bottom,0px));opacity:0;transform:translateY(14px) scale(.985);pointer-events:none;visibility:hidden;transition:opacity .32s ease,transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;flex:1}
.brand i{width:34px;height:34px;border-radius:10px;background:url(icon-round-256.png) center/cover;box-shadow:0 6px 16px rgba(80,60,230,.45)}
.round{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.round svg{width:21px;height:21px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hello{font-size:15px;color:var(--muted)}
.title{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:2px 0 16px}
.title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:10px 0}
.search input::placeholder{color:var(--muted)}
.mic{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;position:relative}
.mic svg{width:21px;height:21px;color:#fff}
.mic.live::after{content:"";position:absolute;inset:-6px;border-radius:18px;border:2px solid var(--acc);animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text)}
.tile b{width:100%;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.25)}
.tile b svg{width:26px;height:26px;position:relative}
.tile b::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 55%)}
.tile:active b{transform:scale(.94)}
.t1 b{background:linear-gradient(135deg,#7c6cff,#5b4de8)}.t2 b{background:linear-gradient(135deg,#ff8a5c,#ff5c8a)}.t3 b{background:linear-gradient(135deg,#2fd3a0,#18a6b8)}.t4 b{background:linear-gradient(135deg,#4aa3ff,#3066ff)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,#4a35d6 0%,#7c6cff 55%,#4aa3ff 100%);box-shadow:0 18px 40px rgba(88,66,230,.4)}
.hero::before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.hero small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero h3{font-size:21px;margin:6px 0 4px;position:relative;letter-spacing:-.01em}
.hero p{opacity:.9;font-size:14px;position:relative}
.hero .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;position:relative}
.cd{font-size:15px;font-weight:700;background:rgba(255,255,255,.18);padding:8px 12px;border-radius:12px;backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:15px;font-weight:700;font-size:15px;background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(88,66,230,.4)}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.white{background:#fff;color:#3b2fc9;box-shadow:none}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.sec h2{font-size:20px;letter-spacing:-.01em}.sec a,.sec button{font-size:14px;color:var(--acc);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.rail{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:4px 18px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pc{flex:none;width:236px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);text-align:left}
.pc .ph{height:140px;background-size:cover;background-position:center;position:relative;background-color:var(--surface2)}
.pc .pb{padding:12px 14px 14px}.pc h4{margin:0 0 4px;font-size:15.5px;line-height:1.25;letter-spacing:-.005em}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.price{font-weight:800;font-size:16px;margin-top:8px}.price small{font-weight:500;color:var(--muted);font-size:12.5px}
.heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(10,10,25,.5);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.heart svg{width:19px;height:19px}.heart.on{color:#ff5c8a}.heart.on svg{fill:#ff5c8a}
.badge{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(10,10,25,.55);backdrop-filter:blur(8px);color:#fff}
.row-item{display:flex;gap:14px;align-items:center;padding:10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;margin-bottom:10px}
.row-item .th{width:84px;height:84px;border-radius:15px;background-size:cover;background-position:center;flex:none;background-color:var(--surface2)}
.row-item .tx{flex:1;min-width:0}.row-item h4{margin:0 0 3px;font-size:15px;line-height:1.25}
.dist{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--acc);background:rgba(124,108,255,.14);padding:5px 9px;border-radius:999px;white-space:nowrap}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .ico{width:76px;height:76px;border-radius:26px;margin:0 auto 14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--acc)}
.empty .ico svg{width:36px;height:36px}.empty h3{color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:16px}
/* рядом */
.radar{position:relative;height:190px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(124,108,255,.3),transparent 62%),var(--surface);border:1px solid var(--line);margin-bottom:14px}
.radar i{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid rgba(124,108,255,.45);transform:translate(-50%,-50%)}
.radar i:nth-child(1){width:70px;height:70px}.radar i:nth-child(2){width:140px;height:140px}.radar i:nth-child(3){width:210px;height:210px}.radar i:nth-child(4){width:280px;height:280px}
.radar::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:conic-gradient(from 0deg,rgba(124,108,255,.5),transparent 28%);animation:sweep 3.2s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.me{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 0 0 8px rgba(124,108,255,.25)}
.dot{position:absolute;width:11px;height:11px;margin:-5px;border-radius:50%;background:var(--acc2);box-shadow:0 0 12px var(--acc2);animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.4}}
.rad-note{position:absolute;left:14px;bottom:12px;right:14px;font-size:13px;color:var(--muted)}
.range{display:flex;align-items:center;gap:12px;margin:6px 0 14px;font-size:14px;color:var(--muted)}
.range input{flex:1;accent-color:#7c6cff}
.range b{color:var(--text);min-width:52px;text-align:right}
select{width:100%;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15px;margin-bottom:12px}
/* брони */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff}
.bk{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.bk .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bk h4{margin:0;font-size:16px;line-height:1.25}
.st{font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.03em}
.st.s-soon{background:rgba(255,184,77,.16);color:var(--warn)}.st.s-act{background:rgba(61,220,151,.16);color:var(--ok)}.st.s-end{background:rgba(150,150,180,.16);color:var(--muted)}.st.s-req{background:rgba(74,163,255,.16);color:var(--acc2)}
.bk .l2{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.5}
/* ключ */
.keyc{position:relative;border-radius:30px;padding:20px 20px 22px;color:#fff;background:linear-gradient(150deg,#2a1d8f 0%,#5a45e8 55%,#2f86ff 100%);box-shadow:0 24px 50px rgba(70,50,210,.45);overflow:hidden;text-align:center}
.keyc::before{content:"";position:absolute;left:-30%;top:-40%;width:90%;height:90%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 65%)}
.keyc .kt{position:relative;display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:14px}
.keyc .kt small{display:block;opacity:.8;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.keyc .kt b{font-size:17px;line-height:1.25;display:block;margin-top:3px;max-width:240px}
.keyc .kt .lg{width:44px;height:44px;border-radius:13px;background:url(icon-round-256.png) center/cover;flex:none}
.qrbox{position:relative;width:236px;height:236px;margin:0 auto;border-radius:24px;background:#fff;padding:14px;display:grid;place-items:center;transition:filter .4s,transform .4s}
.qrbox svg{width:100%;height:100%;display:block;stroke:none;fill:none}
.qrbox.open{filter:blur(0);transform:scale(.97)}
.qrok{position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,#19c37d,#0e9f6e);display:grid;place-items:center;opacity:0;transform:scale(.9);transition:.35s;color:#fff;pointer-events:none}
.qrbox.open .qrok{opacity:1;transform:none}
.qrok svg{width:90px;height:90px;stroke:#fff;stroke-width:2.4;fill:none}
.qrok p{position:absolute;bottom:20px;font-weight:800;font-size:17px}
.ttl{position:relative;margin:14px auto 0;font-size:13px;opacity:.9;display:flex;align-items:center;justify-content:center;gap:8px}
.ring{width:22px;height:22px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3}.ring .bgc{stroke:rgba(255,255,255,.3)}.ring .fgc{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.hold{position:relative;width:100%;margin-top:18px;height:62px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-weight:800;font-size:16px;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.hold span{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:100%}
.hold svg{width:22px;height:22px}
.kfacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kfacts .card{padding:13px}.kfacts small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.kfacts b{font-size:15px}
.off{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(61,220,151,.14);color:var(--ok)}
.off.no{background:rgba(255,184,77,.16);color:var(--warn)}
.off i{width:8px;height:8px;border-radius:50%;background:currentColor}
/* профиль */
.prof{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.ava{width:68px;height:68px;border-radius:24px;background:var(--grad);display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;box-shadow:0 12px 26px rgba(88,66,230,.4)}
.prof h2{font-size:21px}.prof p{color:var(--muted);font-size:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px}
.li{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:15.5px;font-weight:600}
.li:last-child{border-bottom:0}.li .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(124,108,255,.15);color:var(--acc);flex:none}
.li .ic svg{width:19px;height:19px}.li small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:1px}
.li .go{margin-left:auto;color:var(--muted)}.li .go svg{width:18px;height:18px}
.sw{margin-left:auto;width:48px;height:28px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--acc);border-color:transparent}.sw.on::after{transform:translateX(20px)}
.ver{text-align:center;color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.6}
/* табы */
.tabs{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:26px;background:var(--tab);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:19px;font-size:10.5px;font-weight:700;color:var(--muted);position:relative;transition:color .25s}
.tab svg{width:23px;height:23px;transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.tab.on{color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(88,66,230,.45)}
.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tab .nb{position:absolute;top:3px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:#ff5c8a;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
/* шторка */
.dim{position:absolute;inset:0;background:rgba(5,5,15,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;z-index:50;background:var(--bg2);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px rgba(0,0,0,.5);scrollbar-width:none}
.sheet.on{transform:none}
.grip{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet .big{height:210px;border-radius:22px;background-size:cover;background-position:center;position:relative;margin-bottom:14px;background-color:var(--surface2)}
.sheet h3{font-size:22px;letter-spacing:-.01em;margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.pill{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.acts .btn{width:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}.kv span{color:var(--muted)}.kv:last-child{border:0}
.toast{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:88%;padding:12px 18px;border-radius:16px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.35s;z-index:80;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ibar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,rgba(124,108,255,.2),rgba(74,163,255,.14));border:1px solid rgba(124,108,255,.35);margin-bottom:16px;font-size:14px}
.ibar b{display:block}.ibar .btn{padding:9px 14px;font-size:13.5px;margin-left:auto}
.rv{opacity:0;transform:translateY(16px)}.on .rv{animation:rv .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rv{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#s-near{padding:0;overflow:hidden}
#mapc{position:absolute;inset:0;z-index:0;isolation:isolate;background:var(--surface2)}
.leaflet-container{font-family:inherit;background:var(--surface2)}
:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(188deg) brightness(.92) contrast(.88) saturate(.6)}
.leaflet-control-attribution{background:rgba(10,10,25,.55)!important;color:#c9cbe6!important;font-size:9.5px!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:#cbbfff!important}
.mtop{position:absolute;left:0;right:0;top:0;z-index:6;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none}
.msearch{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--tab);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:11px 14px;box-shadow:var(--shadow);font-weight:700;font-size:15px}
.msearch svg{width:22px;height:22px;flex:none;color:var(--acc)}.msearch span{flex:1}.msearch small{color:var(--muted);font-weight:600}
.mchips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 6px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--tab);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);font-size:13px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.mchip i{width:10px;height:10px;border-radius:50%;background:var(--c,#888)}
.mchip.on{background:var(--grad);color:#fff;border-color:transparent}.mchip.on i{background:#fff}
.mfab{position:absolute;right:14px;z-index:6;width:50px;height:50px;border-radius:50%;background:var(--tab);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);bottom:calc(214px + env(safe-area-inset-bottom,0px))}
.mfab svg{width:23px;height:23px}.mfab.acc{background:var(--grad);color:#fff;border-color:transparent;bottom:calc(272px + env(safe-area-inset-bottom,0px))}
.mfab.busy svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.mcar{position:absolute;left:0;right:0;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:12px;overflow-x:auto;padding:6px 9% 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.mcar::-webkit-scrollbar{display:none}
.mc{flex:none;width:82%;scroll-snap-align:center;display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .25s,border-color .25s}
.mc.sel{border-color:var(--acc);transform:translateY(-3px)}
.mc .th{width:92px;height:92px;border-radius:16px;background-size:cover;background-position:center;flex:none;background-color:var(--surface2)}
.mc .tx{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.mc h4{margin:0 0 3px;font-size:15px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc .pr{font-weight:800;font-size:16px;margin-top:6px}.mc .pr small{font-weight:500;color:var(--muted);font-size:12px}
.mc .dd{font-size:12px;font-weight:700;color:var(--acc);margin-top:3px}
.pin{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;padding:6px 10px;border-radius:12px;background:var(--c);color:#fff;font:800 12.5px system-ui,sans-serif;box-shadow:0 6px 14px rgba(0,0,0,.4);border:2px solid #fff;transition:transform .2s;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;margin-left:-5px;background:var(--c);border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
.pin.sel{transform:translate(-50%,-100%) scale(1.22);z-index:999!important}
.pin.hl{color:#14112e;text-shadow:none}
.far .pin{transform:translate(-50%,-50%);width:16px;height:16px;padding:0;border-radius:50%;font-size:0;border-width:2.5px;box-shadow:0 3px 8px rgba(0,0,0,.4)}.far .pin::after{display:none}
.far .pin.sel{transform:translate(-50%,-100%) scale(1.15);width:auto;height:auto;padding:6px 10px;border-radius:12px;font-size:12.5px}.far .pin.sel::after{display:block}
.me-dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#2f86ff;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,134,255,.6);animation:mep 1.8s infinite}
@keyframes mep{to{box-shadow:0 0 0 22px rgba(47,134,255,0)}}
.mnote{position:absolute;left:14px;right:14px;top:calc(118px + env(safe-area-inset-top,0px));z-index:6;padding:10px 14px;border-radius:14px;background:rgba(255,184,77,.95);color:#2a1d00;font-size:13px;font-weight:600;display:none}
.mnote.on{display:block}
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(700px 500px at 50% 35%,rgba(124,108,255,.45),transparent 65%),#090a12;color:#fff;transition:opacity .5s,visibility .5s}
#splash.off{opacity:0;visibility:hidden}
#splash i{width:104px;height:104px;border-radius:30px;background:url(icon-round-256.png) center/cover;box-shadow:0 20px 50px rgba(90,70,240,.6);animation:spop .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes spop{from{transform:scale(.5);opacity:0}}
#splash b{font-size:30px;letter-spacing:-.01em;background:linear-gradient(100deg,#fff 30%,#b8acff 45%,#fff 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
#splash small{opacity:.7;font-size:13.5px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;height:112px;border-radius:22px;overflow:hidden;text-align:left;color:#fff;background-size:cover;background-position:center;box-shadow:var(--shadow)}
.cat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,22,.05) 20%,rgba(8,8,22,.82))}
.cat span{position:absolute;left:14px;bottom:11px;right:10px;font-weight:800;font-size:16px;line-height:1.15}
.cat small{display:block;font-weight:600;opacity:.8;font-size:12px;margin-top:2px}
.promo{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#ff8a5c,#ff5c8a);color:#fff;box-shadow:0 16px 34px rgba(255,92,138,.35)}
.promo svg{width:38px;height:38px;flex:none}.promo b{display:block;font-size:17px}.promo p{font-size:13.5px;opacity:.92;margin-top:2px}
.promo .btn{margin-left:auto;background:#fff;color:#d93a6b;box-shadow:none;padding:10px 14px}
.sheet .big::after{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,transparent 50%,rgba(8,8,22,.7))}
.sheet .big .pp{position:absolute;left:14px;bottom:12px;z-index:2;color:#fff;font-weight:800;font-size:22px}.sheet .big .pp small{font-weight:600;opacity:.85;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center}
.facts b{display:block;font-size:17px}.facts small{color:var(--muted);font-size:11.5px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stp .ctl{display:flex;align-items:center;gap:14px}
.stp .ctl button{width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700}
.stp .ctl b{min-width:70px;text-align:center;font-size:16px}
.fld{width:100%;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15px}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin:12px 0}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}.tot b{font-size:26px;letter-spacing:-.01em}
.okc{width:92px;height:92px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#19c37d,#0e9f6e);color:#fff;animation:spop .6s cubic-bezier(.2,.9,.3,1.3)}
.okc svg{width:48px;height:48px;stroke-width:2.6}

.btn.sm{padding:9px 13px;font-size:13px;border-radius:12px}.btn.glass{background:rgba(255,255,255,.2);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.32)}
.hero .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.tool{display:flex;align-items:center;gap:11px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:700;font-size:14px;line-height:1.2}
.tool b{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}.tool b svg{width:21px;height:21px}
.tool small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.tool:active{transform:scale(.97)}
.okp{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 12px;border-radius:999px;background:rgba(61,220,151,.14);color:var(--ok);font-size:13px;font-weight:700}
.cmpw{display:grid;place-items:center;margin:14px 0 8px}
.cmpr{position:relative;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,var(--surface2),var(--surface));border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(124,108,255,.22),var(--shadow);transition:transform .2s linear}
.cmpr .n{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-style:normal;font-weight:800;color:#ff5c8a;font-size:14px}
.cmpa{position:absolute;inset:0;transition:transform .2s linear}
.cmpa::before{content:"";position:absolute;left:50%;top:30px;margin-left:-24px;border:24px solid transparent;border-bottom:78px solid #7c6cff;border-top:0;filter:drop-shadow(0 6px 10px rgba(124,108,255,.6))}
.cmpa::after{content:"";position:absolute;left:50%;top:108px;width:7px;height:78px;margin-left:-3.5px;border-radius:4px;background:linear-gradient(#7c6cff,transparent)}
.cmpd{text-align:center;font-size:36px;font-weight:800;letter-spacing:-.02em}.cmpt{text-align:center;color:var(--muted);font-size:14px}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.chk i{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.2s}.chk i svg{width:16px;height:16px;opacity:0;stroke:#fff;stroke-width:3}
.chk.on i{background:var(--ok);border-color:var(--ok)}.chk.on i svg{opacity:1}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ph-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.dice{font-size:64px;text-align:center;animation:spop .7s cubic-bezier(.2,.9,.3,1.4)}

.leaflet-container#mapc,.rmap.leaflet-container{background:var(--surface2)}
.rmap{height:236px;border-radius:20px;overflow:hidden;border:1px solid var(--line);isolation:isolate;background:var(--surface2)}
.rinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rinfo div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.rinfo b{display:block;font-size:17px}.rinfo small{color:var(--muted);font-size:11.5px}

<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;

 if(t.closest("[data-ishot]")){var f=$("#ifile");if(f)f.click();return}
 if(t.closest("[data-ishare]")){inspShare();return}
 if(t.closest('[data-act="surprise"]')){surprise();return}
});
